services:
  local-reels:
    build: .
    ports:
      - "8000:8000"
    environment:
      VIDEO_DIR: /data/videos
      DB_PATH: /data/db/localreel.db
    volumes:
      # Put your video files in ./videos on the host (or change the left side).
      # Writable so in-app moves to another folder work.
      - ./videos:/data/videos
      - reel-data:/data/db

volumes:
  reel-data:
